<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>MIRAI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- The staff design is drawn on a 1366 x 769 canvas; app.js scales it to fill any screen. -->
  <div id="canvas" class="canvas">
    <!-- One face for every screen: it never moves, only the eyes change. -->
    <div id="face" class="face" data-mood="sleeping" aria-hidden="true">
      <svg width="0" height="0" class="defs">
        <defs>
          <filter id="glow" filterUnits="userSpaceOnUse" x="-80" y="-80" width="520" height="380">
            <feGaussianBlur stdDeviation="7" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
      </svg>
      <div class="eyes">
        <span class="wave left">)))</span>
        <svg class="eye" viewBox="-20 -20 360 220">
          <path class="arc" d="M 25 150 A 135 135 0 0 1 295 150"/>
          <path class="closed" d="M 25 60 A 135 135 0 0 0 295 60"/>
          <ellipse class="open" cx="160" cy="100" rx="95" ry="76"/>
          <path class="flat" d="M 50 110 L 270 110"/>
        </svg>
        <svg class="eye" viewBox="-20 -20 360 220">
          <path class="arc" d="M 25 150 A 135 135 0 0 1 295 150"/>
          <path class="closed" d="M 25 60 A 135 135 0 0 0 295 60"/>
          <ellipse class="open" cx="160" cy="100" rx="95" ry="76"/>
          <path class="flat" d="M 50 110 L 270 110"/>
        </svg>
        <span class="wave right">(((</span>
      </div>
      <!-- Sleeping bubbles above the right eye (welcome screen only). -->
      <span class="bubble small"></span><span class="bubble big"></span>
      <div id="status" class="status" role="status"></div>
    </div>

    <!-- Welcome: MIRAI sleeps until someone touches the screen. -->
    <section id="welcome" class="welcome" aria-labelledby="welcome-title">
      <p id="welcome-title" class="welcome-text" data-i18n="welcome">Halo! Aku MIRAI, siap membantu mencari informasi tentang BINUS ASO.</p>
      <button id="start" class="pill outline start" type="button"><span data-i18n="touchStart">Sentuh layar untuk memulai</span> <span aria-hidden="true">👆</span></button>
    </section>

    <main id="chat" class="chat" hidden>
      <ol id="messages" class="messages" aria-live="polite"></ol>

      <div class="controls">
        <button id="topics" class="pill outline topics" type="button" aria-controls="suggestions" aria-expanded="false" data-i18n="topics">Topik populer</button>
        <button id="type" class="pill outline type" type="button" aria-controls="keyboard" aria-expanded="false" data-i18n="type">Ketik</button>
        <button id="mic" class="pill primary mic" type="button">
          <span class="mic-level" aria-hidden="true"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 0 0-7 0v6A3.5 3.5 0 0 0 12 15Zm6-3.5a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.91V20H8.5a1 1 0 1 0 0 2h7a1 1 0 1 0 0-2H13v-2.59a6 6 0 0 0 5-5.91Z"/></svg>
          <span id="mic-label" data-i18n="talk">Mulai bertanya</span>
        </button>
        <button id="cancel" class="pill outline cancel" type="button" hidden data-i18n="cancel">✕ Batal</button>
      </div>

      <div id="suggestions" class="popup suggestions" hidden aria-label="Suggested questions"></div>

      <!-- On-screen keyboard: the kiosk has no physical keyboard. inputmode=none keeps the system one away. -->
      <div id="keyboard" class="keyboard" hidden>
        <form id="text-form" class="text-form" autocomplete="off">
          <label for="text" class="text-label" data-i18n="typeLabel">Ketik pertanyaanmu</label>
          <input id="text" type="text" maxlength="500" inputmode="none" data-i18n-placeholder="placeholder">
          <div class="text-actions">
            <button type="button" id="close-keyboard" class="pill outline-dark" data-i18n="close">Tutup</button>
            <button type="submit" class="pill primary send"><span data-i18n="send">Kirim</span> <span aria-hidden="true">➔</span></button>
          </div>
        </form>
        <div id="keys" class="keys"></div>
      </div>
    </main>

    <!-- The design's "..." menu: language, volume and finishing the visit. -->
    <div id="menu" class="popup menu" hidden>
      <button type="button" id="menu-language"><span aria-hidden="true">🌐</span> <span data-i18n="languageItem">Bahasa - ID</span></button>
      <button type="button" id="menu-volume"><span aria-hidden="true">🔊</span> <span id="volume-label">Volume 100%</span></button>
      <button type="button" id="finish" class="finish"><span aria-hidden="true">✓</span> <span data-i18n="finish">Selesai</span></button>
    </div>
    <button id="more" class="more" type="button" aria-controls="menu" aria-expanded="false" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>

    <div id="idle-warning" class="idle-warning" hidden role="alertdialog" aria-live="assertive">
      <p data-i18n="stillThere">Masih di sana? Sentuh layar untuk melanjutkan.</p>
    </div>
  </div>

  <script src="recorder.js"></script>
  <script src="app.js"></script>
</body>
</html>
